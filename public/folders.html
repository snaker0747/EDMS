<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14264A">
<title>จัดการโฟลเดอร์ | ระบบบริหารจัดการเอกสารอิเล็กทรอนิกส์ ส่วนการโยธา</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/app.css">
<link rel="modulepreload" href="/js/common.js">
<link rel="modulepreload" href="/js/folders.js">
</head>
<body>
<div id="top"></div>
<noscript><p style="padding:24px">ระบบนี้ต้องเปิดใช้งาน JavaScript</p></noscript>
<main class="wrap" aria-busy="true">
<div class="row spread"><div><h1>จัดการโฟลเดอร์และช่องรายละเอียด</h1><div class="muted" style="font-size:14px">สร้าง เปลี่ยนชื่อ หรือย้ายที่นี่ ระบบจะปรับโฟลเดอร์ในที่เก็บไฟล์ให้ตรงกัน</div></div><span class="row" style="gap:8px"><button class="btn" id="syncSheet" type="button" hidden>ซิงก์กับชีต</button><button class="btn" id="sync" type="button" hidden>ซิงก์ไฟล์จากที่เก็บไฟล์</button></span></div>
<div class="cols">
<div style="flex:3 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px">
<section class="card"><h2>สร้างโฟลเดอร์ใหม่</h2><div class="row" style="align-items:flex-end"><div class="field" style="flex:2 1 220px"><label for="n-name">ชื่อโฟลเดอร์</label><input id="n-name" type="text" maxlength="150" placeholder="เช่น งานซ่อมบำรุงไฟฟ้าสาธารณะ"></div><div class="field" style="flex:2 1 220px"><label for="n-parent">อยู่ภายใต้</label><div id="parentHost"></div></div><button class="btn primary" id="create" type="button">สร้างโฟลเดอร์</button></div></section>
<section class="card" style="padding:0;overflow:hidden;gap:0"><div style="padding:14px 20px;border-bottom:1px solid var(--line);background:var(--lav);font-size:13px;font-weight:600;color:var(--ink2)">โครงสร้างโฟลเดอร์ปัจจุบัน</div><div id="rows"></div></section></div>
<div style="flex:2 1 400px;min-width:0;display:flex;flex-direction:column;gap:16px">
<section class="card"><div><h2>ช่องรายละเอียดของเอกสาร</h2><div class="muted" style="font-size:13px">กำหนดเองได้ว่าเอกสารแต่ละฉบับต้องกรอกอะไรบ้าง</div></div><div id="fields" style="display:flex;flex-direction:column;gap:8px"></div><button class="btn dashed" id="addField" type="button" hidden>+ เพิ่มช่องรายละเอียด</button></section>
<section class="card"><h2>ประเภทเอกสาร</h2><div class="row" id="types"></div><button class="btn dashed" id="addType" type="button" hidden>+ เพิ่มประเภทเอกสาร</button></section>
</div></div></main>
<script type="module" src="/js/folders.js"></script>
</body>
</html>
